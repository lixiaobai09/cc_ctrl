[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cctl"
version = "0.1.0"
description = "Stash and resume coding-agent sessions with tmux integration"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
web = [
    "starlette>=0.40,<0.50; python_version < '3.10'",
    "starlette>=0.40,<1; python_version >= '3.10'",
    "uvicorn>=0.30,<0.40; python_version < '3.10'",
    "uvicorn>=0.30,<1; python_version >= '3.10'",
    "websockets>=13,<16; python_version < '3.10'",
    "websockets>=13; python_version >= '3.10'",
    "anyio>=4.4,<4.13; python_version < '3.10'",
    "argon2-cffi>=23",
]
test = ["httpx>=0.27", "build", "hatchling"]

[project.scripts]
cctl = "cctl.cli:main"
cct = "cctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cctl"]
